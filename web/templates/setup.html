<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingBot - First-time setup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container" style="max-width:420px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-1 text-center">Create the admin account</h4>
      <p class="text-muted text-center small mb-3">This is the only account this dashboard needs — create it now, before exposing it to the internet.</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/setup">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" minlength="8" required>
          <div class="form-text">At least 8 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account &amp; log in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
