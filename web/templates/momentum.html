<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingBot — Momentum</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% include "_theme.html" %}
<style>
  body { background:#f4f6f8; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .conviction-low { opacity:.75; }
  .badge-strategy-A { background:#0d6efd; }
  .badge-strategy-B { background:#198754; }
  .badge-strategy-C { background:#fd7e14; }
  .badge-strategy-D { background:#6f42c1; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="container-fluid px-4 pb-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Momentum Scanner — Phase 1 (Scan + Alert only, no orders placed)</h4>
    <div class="form-check form-switch fs-5">
      <input class="form-check-input" type="checkbox" role="switch" id="masterSwitch">
      <label class="form-check-label" id="masterLabel" for="masterSwitch">loading…</label>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4"><strong>Poll interval:</strong> <span id="pollSeconds">—</span>s</div>
        <div class="col-md-4"><strong>Entry window (ET):</strong> <span id="entryWindow">—</span></div>
        <div class="col-md-4"><strong>Signals today:</strong> <span id="signalsToday">—</span></div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">Detectors</div>
    <div class="card-body">
      <div class="row" id="strategyToggles"><em class="text-muted">loading…</em></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      Recent signals
      <button class="btn btn-sm btn-outline-secondary" onclick="loadSignals()">Refresh</button>
    </div>
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0 mono" style="font-size:.85rem">
        <thead>
          <tr>
            <th>Time</th><th>Strategy</th><th>Symbol</th><th>Price</th>
            <th>Entry</th><th>Stop</th><th>Scale 1</th><th>Scale 2</th>
            <th>Size hint</th><th>Conviction</th>
          </tr>
        </thead>
        <tbody id="signalsBody">
          <tr><td colspan="10" class="text-muted">loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const STRATEGY_NAMES = {{ strategy_names | tojson }};

async function getJSON(path) {
  const res = await fetch(path, { credentials: "same-origin" });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function postJSON(path, body) {
  const res = await fetch(path, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function renderStrategyToggles(strategies) {
  const el = document.getElementById("strategyToggles");
  el.innerHTML = "";
  for (const key of Object.keys(strategies)) {
    const s = strategies[key];
    const col = document.createElement("div");
    col.className = "col-md-3 mb-2";
    col.innerHTML = `
      <div class="form-check form-switch">
        <input class="form-check-input strategy-toggle" type="checkbox" role="switch"
               id="strat_${key}" data-strategy="${key}" ${s.enabled ? "checked" : ""}>
        <label class="form-check-label" for="strat_${key}">
          <span class="badge badge-strategy-${key}">${key}</span> ${s.name}
        </label>
      </div>`;
    el.appendChild(col);
  }
  document.querySelectorAll(".strategy-toggle").forEach(cb => {
    cb.addEventListener("change", async (e) => {
      const key = e.target.dataset.strategy;
      try {
        await postJSON("/api/momentum/strategy_toggle", { strategy: key, enabled: e.target.checked });
      } catch (err) {
        alert("Failed to toggle " + key + ": " + err.message);
        e.target.checked = !e.target.checked;
      }
    });
  });
}

async function loadStatus() {
  const status = await getJSON("/api/momentum/status");
  const master = document.getElementById("masterSwitch");
  master.checked = status.enabled;
  document.getElementById("masterLabel").textContent = status.enabled ? "Scanning" : "Stopped";
  document.getElementById("pollSeconds").textContent = status.poll_seconds;
  document.getElementById("entryWindow").textContent = status.entry_window_et.join(" – ");
  renderStrategyToggles(status.strategies);
}

document.getElementById("masterSwitch").addEventListener("change", async (e) => {
  try {
    const r = await postJSON("/api/momentum/toggle", { enabled: e.target.checked });
    document.getElementById("masterLabel").textContent = r.enabled ? "Scanning" : "Stopped";
  } catch (err) {
    alert("Failed to toggle: " + err.message);
    e.target.checked = !e.target.checked;
  }
});

function fmt(n) { return (n === null || n === undefined) ? "—" : Number(n).toFixed(2); }

async function loadSignals() {
  const rows = await getJSON("/api/momentum/signals?limit=100");
  const body = document.getElementById("signalsBody");
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("signalsToday").textContent =
    rows.filter(r => r.trade_date === today).length;
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="10" class="text-muted">No signals yet.</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr class="${r.conviction === 'low' ? 'conviction-low' : ''}">
      <td>${r.signal_iso.replace('T', ' ').slice(0, 19)}</td>
      <td><span class="badge badge-strategy-${r.strategy}">${r.strategy}</span></td>
      <td>${r.symbol}${r.above_preferred_range ? ' ⚠' : ''}</td>
      <td>${fmt(r.price)}</td>
      <td>${fmt(r.entry_ref)}</td>
      <td>${fmt(r.stop_price)}</td>
      <td>${fmt(r.first_scale_price)}</td>
      <td>${fmt(r.second_scale_price)}</td>
      <td>${r.shares_hint ?? "—"}</td>
      <td>${r.conviction}</td>
    </tr>`).join("");
}

loadStatus();
loadSignals();
setInterval(loadSignals, 30000);
</script>
</body>
</html>
