name: Deploy to Oracle server

# DISABLED 2026-09-12: the automatic push trigger below was removed -
# every one of its ~71 runs failed (all deploys this whole session were
# done by hand instead, directly on the server), and it was only ever
# duplicating that manual work anyway (git pull + restart against a
# checkout already up to date). workflow_dispatch is kept so this can
# still be run on demand from the Actions tab if the secrets/SSH setup
# ever get fixed - re-add the `push:` block below to re-enable automatic
# deploys again.
#
# Original behavior (for when re-enabling): pushed straight to production
# the moment a commit landed on this repo's own default branch (claude/
# ai-trading-bot-ibkr-haqc10 - there is no "main" here) - no tests, no
# open-position check, no manual approval, by explicit choice (see
# DEPLOY.md's own "Automatic deployment" section for why).
#
# If you later rename/replace the default branch (e.g. introduce a real
# "main"), update the branch name below AND in DEPLOY.md's own setup
# section to match, or this workflow silently stops firing.
on:
  # push:
  #   branches: [claude/ai-trading-bot-ibkr-haqc10]
  workflow_dispatch: {}

# Serializes deploys so two pushes close together can't run git pull +
# systemctl restart on the server at the same time and step on each other
# - the second waits for the first to finish rather than running in
# parallel (never cancels an in-flight deploy partway through).
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            sudo -iu tradingbot bash -c "cd /opt/tradingbot && git pull && .venv/bin/pip install -r requirements.txt"
            sudo systemctl restart trading-bot-live.service dashboard.service
